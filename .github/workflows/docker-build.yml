        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Get Release Info
      id: get_release
      uses: bruceadams/get-release@v1.3.2
      env:
        GITHUB_TOKEN: ${{ github.token }}

    - name: Build and Push Docker Images
      run: |
        docker build . --file deployment/Dockerfile --tag ghcr.io/savageaim/app/frontend:latest -t ghcr.io/savageaim/app/frontend:${{ steps.get_release.outputs.tag_name }}
        docker push --all-tags ghcr.io/savageaim/app/frontend
        # Rename images to dockerhub and push there too
        docker image tag ghcr.io/savageaim/app/frontend:latest freyamade/savageaim:frontend
        docker image tag ghcr.io/savageaim/app/frontend:${{ steps.get_release.outputs.tag_name }} freyamade/savageaim:frontend-${{ steps.get_release.outputs.tag_name }}
        docker push --all-tags freyamade/savageaim
