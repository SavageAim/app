name: Docker Image CI

on:
  release:
    types:
      - published

jobs:
  build-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
    - uses: actions/checkout@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@f4ef78c080cd8ba55a85445d5b36e214a81df20a
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Log in to the Container registry
      uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Get Release Info
      id: get_release
      uses: bruceadams/get-release@v1.3.2
      env:
        GITHUB_TOKEN: ${{ github.token }}

    - name: Build and Push Docker Images
      run: |
        docker build . --file deployment/Dockerfile -t ghcr.io/savageaim/app/backend:latest -t ghcr.io/savageaim/app/backend:${{ steps.get_release.outputs.tag_name }}
        docker push --all-tags ghcr.io/savageaim/app/backend
        # Rename images to dockerhub and push there too
        docker image tag ghcr.io/savageaim/app/backend:latest freyamade/savageaim:backend
        docker image tag ghcr.io/savageaim/app/backend:${{ steps.get_release.outputs.tag_name }} freyamade/savageaim:backend-${{ steps.get_release.outputs.tag_name }}
        docker push --all-tags freyamade/savageaim

  build-ws-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
    - uses: actions/checkout@v3

    - name: Log in to Docker Hub
